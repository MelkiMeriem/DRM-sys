syntax = "proto3";

package drm.v1;

option java_multiple_files = true;
option java_package = "com.example.drm.proto";
option java_outer_classname = "DrmProto";

service JobService {
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
}

service ClusterService {
  // Raft-like election & replication
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

  // Forward client job to leader
  rpc ForwardJob(ForwardJobRequest) returns (ForwardJobResponse);

  // Simple health/status for dashboard
  rpc GetNodeStatus(GetNodeStatusRequest) returns (GetNodeStatusResponse);
}

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  JOB_TYPE_SUM = 1;
  JOB_TYPE_SHA256 = 2;
  JOB_TYPE_MESSAGE = 3;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_SUCCEEDED = 3;
  JOB_STATUS_FAILED = 4;
}

message Job {
  string job_id = 1;
  JobType type = 2;
  string payload_json = 3;
  JobStatus status = 4;
  string result_json = 5;
  string error_message = 6;
  int64 created_at_epoch_ms = 7;
  int64 finished_at_epoch_ms = 8;
  string executed_by_node_id = 9;
}

message SubmitJobRequest {
  JobType type = 1;
  string payload_json = 2;
  string client_request_id = 3; // idempotency hint
}

message SubmitJobResponse {
  Job job = 1;
  string leader_node_id = 2; // filled when redirected/forwarded
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
  string leader_node_id = 2;
}

message RequestVoteRequest {
  string candidate_id = 1;
  int64 term = 2;
  int64 last_log_index = 3;
  int64 last_log_term = 4;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message LogEntry {
  int64 index = 1;
  int64 term = 2;
  string command_json = 3; // e.g. "enqueue job", "update job status"
}

message AppendEntriesRequest {
  string leader_id = 1;
  int64 term = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 match_index = 3;
}

message ForwardJobRequest {
  SubmitJobRequest submit = 1;
}

message ForwardJobResponse {
  SubmitJobResponse submit = 1;
}

message GetNodeStatusRequest {}

message GetNodeStatusResponse {
  string node_id = 1;
  string role = 2; // LEADER/FOLLOWER/CANDIDATE
  int64 term = 3;
  string leader_id = 4;
  int64 last_heartbeat_epoch_ms = 5;
  int64 log_last_index = 6;
  int64 commit_index = 7;
  int64 jobs_total = 8;
  int64 jobs_running = 9;
}
